[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "launchplane"
version = "0.1.0.dev0"
description = "Interactive launch-plane editor for scientific beam-based simulations."
readme = "README.md"
authors = [
    {name = "Mark Cronin-Golomb"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "PySide6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
