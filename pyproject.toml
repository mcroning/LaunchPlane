[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchplane"
version = "0.1.0"
description = "Interactive launch-plane editor for scientific beam-based simulations."
authors = [
    {name = "Mark Cronin-Golomb"}
]
requires-python = ">=3.11"

dependencies = [
    "PySide6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]